<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>삼국무쌍 서바이벌</title>
<meta name="description" content="삼국지 풍 뱀서라이크 생존 게임. 무장 8명, 무기 조합, 보스, 일일 도전.">
<meta property="og:title" content="삼국무쌍 서바이벌">
<meta property="og:description" content="황건적의 난. 밀려오는 적도를 홀로 막아라. 20분을 버티면 천하가 그대의 것.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Serif+KR:wght@400;700;900&display=swap">
<style>
/* Layout: one fullscreen battlefield canvas, overlays stacked on top. Single dark theme by choice. */
:root{
  --ink:#0d0b09;--paper:#3a3224;--paper2:#2a241d;--paper3:#1f1a14;
  --cinnabar:#c8402e;--gold:#d8a94a;--jade:#5fae8f;--sky:#4df0ff;
  --fg:#efe6d2;--muted:#9d917c;
  --f-brush:'Nanum Brush Script','Noto Serif KR',serif;
  --f-serif:'Noto Serif KR','Nanum Myeongjo',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-serif);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:relative;width:100%;height:100%}
canvas#c{display:block;width:100%;height:100%;background:var(--paper)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(13,11,9,.86);text-align:center;gap:14px;overflow:auto}
h1{font-family:var(--f-brush);font-size:clamp(40px,8vw,76px);margin:0;line-height:1;color:var(--fg);text-wrap:balance}
h1 small{display:block;font-family:var(--f-serif);font-size:clamp(12px,2vw,15px);letter-spacing:.3em;color:var(--gold);margin-top:6px;font-weight:400}
h2{font-size:15px;letter-spacing:.2em;color:var(--gold);margin:4px 0 0;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;max-width:52ch;margin:0;line-height:1.5}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:980px}
.card{width:176px;max-width:100%;background:var(--paper2);border:1px solid #3d3428;padding:12px 12px 10px;cursor:pointer;text-align:left;
  color:var(--fg);font-family:inherit;transition:transform .12s,border-color .12s;position:relative;display:flex;flex-direction:column;gap:3px}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.card .gl{font-size:44px;font-weight:900;line-height:1;color:var(--cinnabar);font-family:var(--f-serif)}
.card .nm{font-size:16px;font-weight:700;margin-top:4px}
.card .ds{font-size:12px;color:var(--muted);line-height:1.45}
.card .ev{font-size:11px;color:var(--jade);margin-top:4px;border-top:1px dashed #3d3428;padding-top:4px}
.card .ev.no{color:var(--muted)}
.card .ban{position:absolute;bottom:8px;right:9px;font-size:10.5px;color:var(--muted);border:1px solid #3d3428;padding:1px 6px;cursor:pointer}.card .ban:hover{color:var(--cinnabar);border-color:var(--cinnabar)}
.card .tag{position:absolute;top:9px;right:9px;font-size:10.5px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold);padding:1px 6px}
.card.evo{border-color:var(--cinnabar);background:#2d1a16}.card.evo .gl{color:var(--gold)}
.card.mod{border-color:var(--sky);background:#15262b}.card.mod .gl{color:var(--sky)}.card.mod .tag{color:var(--sky);border-color:var(--sky)}
.card.lock{opacity:.55;cursor:default;filter:grayscale(.7)}.card.lock:hover{transform:none;border-color:#3d3428}
.card .trait{font-size:11.5px;color:var(--gold);margin-top:2px}
.card canvas{image-rendering:pixelated;display:block}
.btn{background:var(--cinnabar);color:#fff;border:0;font-family:var(--f-serif);font-weight:700;font-size:15px;padding:11px 24px;cursor:pointer;letter-spacing:.1em}
.btn:focus-visible{outline:2px solid var(--gold)}
.btn.ghost{background:var(--paper2);border:1px solid #3d3428;font-weight:400;font-size:13px;padding:8px 14px;color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:left}
.stats b{color:var(--fg)}
.keys{font-size:12px;color:var(--muted);letter-spacing:.05em}
.keys kbd{border:1px solid #4a4034;padding:1px 5px;font-family:inherit;font-size:11px}
.gold{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid #3d3428;color:var(--muted);font-family:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.panel{display:none;width:100%;max-width:980px;flex-direction:column;align-items:center;gap:10px}
.panel.on{display:flex}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;width:100%;max-width:900px}
.shop .it{background:var(--paper2);border:1px solid #3d3428;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.shop .it b{font-size:14px}.shop .it small{color:var(--muted);font-size:12px}
.shop .pips{display:flex;gap:3px}.shop .pips i{width:14px;height:6px;background:#3d3428}.shop .pips i.on{background:var(--gold)}
.shop .it button{margin-top:2px;align-self:flex-start}
.codex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px}
.codex .e{width:72px;background:var(--paper2);border:1px solid #3d3428;padding:6px 4px;font-size:11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.codex .e .g{font-size:22px;font-weight:900;color:var(--gold)}
.codex .e.unk{opacity:.35}.codex .e.unk .g{color:var(--muted)}
.lb{width:100%;max-width:560px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.lb td,.lb th{padding:5px 8px;border-bottom:1px solid #3d3428;text-align:left}.lb th{color:var(--gold);font-weight:700;letter-spacing:.05em}
.lb tr.me td{color:var(--jade)}
.lb td.r{text-align:right}
input.nm{background:var(--paper3);border:1px solid #3d3428;color:var(--fg);font-family:inherit;font-size:14px;padding:7px 10px;width:160px}
.combo{display:grid;grid-template-columns:1fr;gap:4px 16px;font-size:12.5px;max-width:760px;text-align:left}
.combo span{color:var(--muted)}.combo b{color:var(--gold);font-weight:700}.combo .have{color:var(--jade)}
#hud{position:absolute;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
#xpbar{position:absolute;top:0;left:0;right:0;height:14px;background:rgba(0,0,0,.6);border-bottom:1px solid #000}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f0d58a);transition:width .15s}
#lvl{position:absolute;top:16px;right:14px;font-size:14px;color:var(--gold);letter-spacing:.1em;font-variant-numeric:tabular-nums}
#timer{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 8px #000}
#kills{position:absolute;top:16px;left:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
#goldhud{position:absolute;top:36px;left:14px;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
#buffs{position:absolute;top:58px;left:14px;font-size:12px;color:var(--jade);display:flex;flex-direction:column;gap:2px}
#slots{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;background:rgba(13,11,9,.62);border:1px solid #3d3428;padding:6px 8px;max-width:min(62vw,420px)}
.sgrp{display:flex;align-items:flex-start;gap:6px}
.sgrp .lab{width:34px;flex:none;font-size:10px;letter-spacing:.12em;color:var(--muted);padding-top:9px}
.sgrp .lab b{display:block;font-size:13px;color:var(--gold);letter-spacing:0;font-weight:900}
.srow{display:flex;gap:5px;flex-wrap:wrap}
.slot{width:44px;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .ic{width:36px;height:36px;background:rgba(0,0,0,.55);border:1px solid #3d3428;display:flex;align-items:center;justify-content:center;position:relative;font-weight:900;font-size:20px;color:var(--fg)}
.slot.mod .ic{border-color:var(--sky)}.slot.evo .ic{border-color:var(--gold);background:#2d1a16}
.slot.p .ic{color:var(--jade);font-size:17px}
.slot .ic i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:10px;color:var(--gold);font-variant-numeric:tabular-nums}
.slot .nm{font-size:9.5px;color:var(--muted);white-space:nowrap;max-width:44px;overflow:hidden;text-overflow:ellipsis}
.slot .pips{display:flex;gap:1.5px}.slot .pips i{width:3.5px;height:3px;background:#3d3428}.slot .pips i.on{background:var(--gold)}.slot.mod .pips i.on{background:var(--sky)}
.slot.empty .ic{border-style:dashed;opacity:.35}
@media (max-width:600px){.slot{width:34px}.slot .ic{width:28px;height:28px;font-size:16px}.slot .nm{display:none}.sgrp .lab{width:26px}.sgrp .lab b{font-size:11px}}
#warn{position:absolute;left:50%;top:36%;transform:translateX(-50%);font-family:var(--f-brush);font-size:clamp(36px,7vw,66px);color:var(--cinnabar);opacity:0;transition:opacity .4s;text-shadow:0 0 20px #000;white-space:nowrap}
#tut{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(13,11,9,.85);border:1px solid var(--gold);color:var(--fg);font-size:14px;padding:8px 16px;white-space:nowrap;display:none}
#pausehint{position:absolute;bottom:14px;right:14px;font-size:11px;color:var(--muted);letter-spacing:.08em}
#rotate{position:absolute;inset:0;background:rgba(13,11,9,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--fg);font-size:15px;z-index:20;pointer-events:auto}
#rotate .ic{font-size:48px}
#rescard{max-width:100%;width:min(560px,92vw);border:1px solid #3d3428}
@media (pointer:coarse){#slots{left:auto;right:12px;bottom:auto;top:215px;opacity:.8;transform:scale(.85);transform-origin:top right}}
@media (max-width:600px){.card{width:46%;padding:10px}.card .gl{font-size:34px}.card .nm{font-size:14px}.card .ds{font-size:11px}h1{font-size:34px}.overlay{gap:10px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="kills">斬 0</div><div id="goldhud">金 0</div><div id="buffs"></div><div id="timer">00:00</div><div id="lvl">Lv 1</div>
  <div id="warn"></div><div id="tut"></div>
  <div id="slots"></div>
  <div id="pausehint">ESC 일시정지 · M 소리</div>
</div>
<div id="start" class="overlay">
  <h1>삼국무쌍 서바이벌<small>三 國 無 雙 · 生 存</small></h1>
  <div class="row"><span class="gold" id="goldtotal">金 0</span><span class="sub" id="metasum"></span></div>
  <div class="tabs" id="tabs">
    <button data-p="heroes" class="on">출진</button><button data-p="shop">군비 강화</button><button data-p="codex">도감</button><button data-p="records">기록</button><button data-p="lb">천하 순위</button>
  </div>
  <div class="panel on" id="p-heroes">
    <div class="row"><label class="sub"><input type="checkbox" id="dailychk"> 일일 도전 (<span id="dailydate"></span>) — 모두 같은 전장, 같은 카드</label></div>
    <div class="row" id="resumerow" hidden><button class="btn" id="resumerun">이어하기</button><span class="sub" id="resumeinfo"></span></div>
    <div class="cards" id="heroes"></div>
    <div class="keys"><kbd>W A S D</kbd> 또는 <kbd>← ↑ → ↓</kbd> 이동 · 모바일은 화면을 끌어서 이동 · <kbd>ESC</kbd> 일시정지</div>
    <button class="btn mute ghost" id="mute1">🔊 소리 켜짐</button>
  </div>
  <div class="panel" id="p-shop"><p class="sub">전투에서 얻은 금화로 영구 강화를 산다. 모든 무장에 적용된다.</p><div class="shop" id="shop"></div></div>
  <div class="panel" id="p-codex"><h2>적</h2><div class="codex" id="cdx-e"></div><h2>무기</h2><div class="codex" id="cdx-w"></div><h2>진화</h2><div class="codex" id="cdx-v"></div></div>
  <div class="panel" id="p-records"><div class="stats" id="records"></div></div>
  <div class="panel" id="p-lb">
    <div class="row"><input class="nm" id="pname" maxlength="12" placeholder="이름 (순위표용)"><span class="sub" id="lbstatus">불러오는 중…</span></div>
    <div class="tabs"><button class="on" data-l="all">역대</button><button data-l="daily">오늘</button></div>
    <table class="lb" id="lbtable"></table>
  </div>
</div>
<div id="levelup" class="overlay" hidden>
  <h1 style="font-size:clamp(32px,6vw,54px)">승급<small>陞 級</small></h1>
  <p class="sub" id="lvtext"></p>
  <div class="cards" id="choices"></div>
  <div class="row"><button class="btn ghost" id="reroll">다시 뽑기</button><button class="btn ghost" id="skip">건너뛰기 (+5 金)</button><span class="keys" id="bans"></span></div>
</div>
<div id="chest" class="overlay" hidden>
  <h1 style="font-size:clamp(32px,6vw,54px)">보물상자<small>寶 物 箱</small></h1>
  <canvas id="chestcv" width="200" height="140" style="width:200px;height:140px;image-rendering:pixelated"></canvas>
  <div class="cards" id="chestitems"></div>
  <button class="btn" id="chestok">거둔다</button>
</div>
<div id="pause" class="overlay" hidden>
  <h1 style="font-size:clamp(32px,6vw,54px)">휴전<small>休 戰</small></h1>
  <h2>진화 조합표</h2><div class="combo" id="combo"></div>
  <div class="row"><button class="btn" id="resume">계속 싸운다</button><button class="btn ghost mute">🔊 소리 켜짐</button><button class="btn ghost" id="lowfx">저사양 모드: 꺼짐</button><button class="btn ghost" id="autopick">자동 승급 (Lv25+): 꺼짐</button><button class="btn ghost" id="giveup">전장을 떠난다</button></div>
</div>
<div id="end" class="overlay" hidden>
  <h1 id="endtitle">전사<small id="endsub">戰 死</small></h1>
  <canvas id="rescard" width="1120" height="680"></canvas>
  <div class="row"><span class="gold" id="endgold"></span><span class="sub" id="endlb"></span></div>
  <div class="row"><button class="btn ghost" id="copycard">결과 복사</button><button class="btn ghost" id="toshop">군비 강화</button><button class="btn" id="again">다시 출진</button></div>
</div>
<div id="unlock" class="overlay" hidden style="z-index:15">
  <h1 style="font-size:clamp(32px,6vw,54px)">새 무장 합류<small>新 將 參 戰</small></h1>
  <div class="cards" id="unlockcards"></div>
  <button class="btn" id="unlockok">출진 준비</button>
</div>
<div id="rotate"><div class="ic">📱↻</div><div>가로로 돌리면 더 잘 보여요</div><button class="btn ghost" id="rotateok">그냥 할게요</button></div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let DPR=1,VW=0,VH=0;
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=cv.clientWidth;VH=cv.clientHeight;cv.width=VW*DPR;cv.height=VH*DPR;}
addEventListener('resize',resize);resize();

/* ---------- 데이터 ---------- */
const WEAPONS={
  guandao:{hero:'guanyu',name:'청룡언월도',gl:'斬',col:'#5fae8f',desc:'바라보는 방향을 크게 베어낸다. 반달 궤적.',cd:1.0,dmg:25,modern:{need:'power',name:'청룡 플라즈마 블레이드',gl:'電',desc:'날이 플라즈마로 바뀐다. 더 넓고 더 빠르게 벤다.'},evo:{need:'area',name:'청룡참',gl:'龍',desc:'관우의 위엄. 양쪽을 동시에 베고 범위가 두 배.'}},
  spear:{hero:'zhangfei',name:'장팔사모',gl:'突',col:'#d8a94a',desc:'묵직한 일격. 느리지만 길 위의 모든 것을 꿰뚫고 날려버린다.',cd:1.25,dmg:34,modern:{need:'armor',name:'장팔 레일건',gl:'磁',desc:'굵은 전자기 광선이 전방을 통째로 지운다.'},evo:{need:'cool',name:'장판파 포효',gl:'咆',desc:'장비의 일갈. 창이 사방으로 뻗어나간다.'}},
  dragon:{hero:'zhaoyun',name:'용담창',gl:'龍',col:'#9fc4ff',desc:'창이 쉴 새 없이 회전하며 찔러 나간다.',cd:.32,dmg:9,modern:{need:'amount',name:'용담 개틀링',gl:'銃',desc:'창이 개틀링으로. 회전하며 총알을 퍼붓는다.'},evo:{need:'horse',name:'상산조자룡',gl:'常',desc:'장판파의 단기필마. 여덟 방향을 동시에 꿰뚫는다.'}},
  formation:{hero:'zhugeliang',name:'팔진도',gl:'陣',col:'#d8a94a',desc:'묶기 무기. 부적에 닿은 적은 한참 동안 거의 움직이지 못한다. 피해는 약하다.',cd:0,dmg:2,modern:{need:'dur',name:'팔진 드론 편대',gl:'機',desc:'팔괘 패가 드론으로. 전기 충격으로 적을 묶는다.'},evo:{need:'book',name:'천하삼분지계',gl:'策',desc:'진이 넓어지고 적을 안으로 끌어당긴다.'}},

function genObst(){OBST=[];const r=mulberry(G.daily?[...todayKey()].reduce((a,c)=>a*31+c.charCodeAt(0)|0,99):(Math.random()*1e9)|0);
  for(let i=0;i<34;i++){const x=(r()*2-1)*(MAP-200),y=(r()*2-1)*(MAP-200);if(Math.hypot(x,y)<260)continue;if(LANDMARKS.some(L=>Math.hypot(L.x-x,L.y-y)<300))continue;const kind=r()<.35?'wall':'rock';const R=kind==='wall'?0:34+r()*34;const len=kind==='wall'?160+r()*220:0;const a=r()<.5?0:Math.PI/2;OBST.push({x,y,R,kind,len,a,seed:r()});}}
function obstPush(o,rad){for(const b of OBST){if(b.kind==='rock'){const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1,min=b.R+rad;if(d<min){o.x=b.x+dx/d*min;o.y=b.y+dy/d*min;}}
    else{const hx=b.a===0?b.len/2:14,hy=b.a===0?14:b.len/2;const cx=Math.max(b.x-hx,Math.min(b.x+hx,o.x)),cy=Math.max(b.y-hy,Math.min(b.y+hy,o.y));const dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);if(d<rad){if(d<.01){const px=hx-Math.abs(o.x-b.x),py=hy-Math.abs(o.y-b.y);if(px<py)o.x=b.x+(o.x<b.x?-1:1)*(hx+rad);else o.y=b.y+(o.y<b.y?-1:1)*(hy+rad);}else{o.x=cx+dx/d*rad;o.y=cy+dy/d*rad;}}}}}

}
function bossAct(e,dt){

  if(e.pat==='fire'&&e.pt>(p2?2.6:4)){e.pt=0;const n=p2?6:3;for(let i=0;i<n;i++){const x=G.px+rnd(-190,190),y=G.py+rnd(-190,190);G.zones.push({x,y,enemy:true,R:p2?85:70,life:3.5,dps:p2?18:14,col:'#7b3f8f',gl:'董',tick:0,warnT:.8});}sfx('fire');}
  if(e.pat==='charge'){
    if(e.cs==='wind'){e.cst-=dt;e.spd=0;if(e.cst<=0){e.cs='dash';e.cst=.6;const a=Math.atan2(G.py-e.y,G.px-e.x);e.kx=Math.cos(a)*700;e.ky=Math.sin(a)*700;sfx('rail');shake=.3;}}
    else if(e.cs==='dash'){e.cst-=dt;e.spd=0;e.kx*=1.04;e.ky*=1.04;if(!lowfx)part(e.x+frnd(-20,20),e.y+10,frnd(-30,30),frnd(-20,0),'rgba(190,170,130,.6)',frnd(4,8),.5,-20,'dust');if(e.cst<=0){e.kx=e.ky=0;if(p2&&(e.chain||0)<2){e.chain=(e.chain||0)+1;e.cs='wind';e.cst=.45;}else{e.chain=0;e.cs='rest';e.cst=p2?1.2:1.6;}}}
    else if(e.cs==='rest'){e.cst-=dt;e.spd=30;if(e.cst<=0){e.cs=null;e.spd=ENEMIES.lubu.spd*(p2?1.15:1);}}
    else if(e.pt>(p2?3.5:4.5)){e.pt=0;e.cs='wind';e.cst=.8;warn('여포 돌격 준비','#ffd080');sfx('warcry');}
  }
  if(e.pat==='summon'&&e.pt>(p2?4.5:6)){e.pt=0;const n=p2?10:6;for(let i=0;i<n;i++){const a=i*Math.PI*2/n,s=spawnEnemy(p2&&i%2?'rider':'soldier',a,1);s.x=e.x+Math.cos(a)*70;s.y=e.y+Math.sin(a)*70;}if(p2){e.hp=Math.min(e.mhp,e.hp+e.mhp*.03);dtext(e.x,e.y-e.r-30,'회복','#9ee0c4');}sfx('formation');}
}

function update(dt){
  G.t+=dt;G.frame=(G.frame||0)+1;if(G.hit>0)G.hit-=dt;const low=G.hp<G.maxhp*.25;if(low){G.hb=(G.hb||0)-dt;if(G.hb<=0){G.hb=.85;sfx('heart');}}if(AU.bgm)AU.bgm.gain.value=low?.08:.22;if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}if(G.rageT>0){G.rageT-=dt;if(G.rageT<=0)G.rage=0;}if(G.buffPow>0)G.buffPow-=dt;
  const [mx,my]=moveVec();const sp=G.spd*P.spd;
  if(G.dash>0){curW='charge';G.dash-=dt;G.px+=Math.cos(G.dashA)*G.dashV*dt;G.py+=Math.sin(G.dashA)*G.dashV*dt;
    if(G.dash<=0&&G.dashEnd){const E=G.dashEnd;for(const e of G.enemies){if(e.dead)continue;const d=Math.hypot(e.x-G.px,e.y-G.py);if(d<E.R+e.r){damage(e,E.dmg,G.dashCol);const a=Math.atan2(e.y-G.py,e.x-G.px);e.kx+=Math.cos(a)*220;e.ky+=Math.sin(a)*220;}}G.fx.push({x:G.px,y:G.py,ring:true,R:E.R,col:G.dashCol,life:.35,max:.35});sfx('warcry');shake=Math.max(shake,.1);}

    G.fx.push({x:G.px,y:G.py,ghost:true,flip:Math.cos(G.dashA)<0,col:G.dashCol,life:.3,max:.3});}
  else{G.px+=mx*sp*dt;G.py+=my*sp*dt;}
  {const tmp={x:G.px,y:G.py};obstPush(tmp,14);G.px=tmp.x;G.py=tmp.y;}G.px=Math.max(-MAP,Math.min(MAP,G.px));G.py=Math.max(-MAP,Math.min(MAP,G.py));
  G.moving=!!(mx||my);if(mx||my){const l=Math.hypot(mx,my);G.fxF=mx/l;G.fy=my/l;if(G.tutStep===0)tut(1);}
  {const rg=.4*upLv('regen')+.25*(G.passives.heart||0);if(rg>0){G.regen+=dt;if(G.regen>1){G.regen=0;G.hp=Math.min(G.maxhp,G.hp+rg);}}}
  for(const w of G.weapons)fireWeapon(w,dt);
  doSpawns(dt);landmarks(dt);
  if(G.passives.horse){G.horseT+=dt;if(G.horseT>=180&&!META.unl.horse180){META.unl.horse180=true;saveMeta();}}
  // enemies
  const sep=new Map();let near=false;
  for(const e of G.enemies){
    if(e.dead)continue;
    if(e.pat)bossAct(e,dt);
    const dx=G.px-e.x,dy=G.py-e.y,d=Math.hypot(dx,dy)||1;
    const sm=e.stun>0?0:e.slow>0?(e.slowK||.45):1;if(e.slow>0)e.slow-=dt;else e.slowK=0;if(e.stun>0)e.stun-=dt;let mv=1,ux=dx/d,uy=dy/d;
    if(e.type==='archer'){e.sh-=dt;if(d<200)mv=-.8;else if(d<330)mv=0;if(e.sh<=0&&d<420){e.sh=2.4;const a=Math.atan2(dy,dx)+rnd(-.08,.08);G.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*330,vy:Math.sin(a)*330,life:1.6,dmg:e.dmg});sfx('arrow');}}
    else if(e.type==='bomber'){if(e.fuse!=null){e.fuse-=dt;mv=0;if(e.fuse<=0){e.dead=true;const R=105;G.fx.push({x:e.x,y:e.y,boom:true,R,col:'#ff8a3a',life:.4,max:.4});glyph(e.x,e.y,'炸','#ffb070',70,.5);sfx('boom');shake=Math.max(shake,.3);if(Math.hypot(G.px-e.x,G.py-e.y)<R+14&&G.hit<=0){if(hurtPlayer(e.dmg))return;}for(const o of G.enemies){if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<R)damage(o,30,'#ff8a3a');}G.corpses.push({x:e.x,y:e.y,type:'bomber',flip:false,life:.5,max:.5});continue;}}
      else if(d<80){e.fuse=.85;sfx('fuse');}}
    else if(e.type==='shield'){let want=Math.atan2(dy,dx),da=want-e.face;da=Math.atan2(Math.sin(da),Math.cos(da));const turn=1.1*dt;e.face+=Math.max(-turn,Math.min(turn,da));if(e.block>0)e.block-=dt;}
    else if(e.type==='assassin'){e.st-=dt;if(e.mode==='dash'){mv=3.8;if(e.st<=0){e.mode='rest';e.st=1.1;}}else if(e.mode==='rest'){mv=.3;if(e.st<=0){e.mode=null;}}else{mv=.9;if(d<320&&e.st<=0){e.mode='dash';e.st=.55;const a=Math.atan2(dy,dx);ux=Math.cos(a);uy=Math.sin(a);e.dx=ux;e.dy=uy;glyph(e.x,e.y-30,'刺','#c8a8ff',34,.4);sfx('thrust');}}if(e.mode==='dash'){ux=e.dx;uy=e.dy;}}
    e.x+=ux*e.spd*sm*mv*dt+e.kx*dt;e.y+=uy*e.spd*sm*mv*dt+e.ky*dt;if(!e.boss&&(e.id&3)===(G.frame&3))obstPush(e,e.r*.8);e.kx*=.82;e.ky*=.82;if(e.flash>0)e.flash-=dt;if(e.sq>0)e.sq-=dt;
    const k=((e.x/40)|0)+','+((e.y/40)|0);const o=sep.get(k);if(o){const ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy)||1;if(od<e.r+o.r){e.x+=ox/od*1.5;e.y+=oy/od*1.5;}}else sep.set(k,e);
    if(d<e.r+44)near=true;
    if(d<e.r+14&&G.hit<=0){if(hurtPlayer(e.dmg*(.7+Math.min(.3,G.t/600))))return;}
  }
  G.near=near;
  // projectiles
  for(const p of G.proj){
    if(p.home!=null){const t=G.enemies.find(e=>e.id===p.home&&!e.dead)||nearest(1,700)[0];if(t){p.home=t.id;const want=Math.atan2(t.y-p.y,t.x-p.x),cur=Math.atan2(p.vy,p.vx);let da=Math.atan2(Math.sin(want-cur),Math.cos(want-cur));da=Math.max(-4*dt,Math.min(4*dt,da));const sp=Math.min(900,Math.hypot(p.vx,p.vy)+600*dt);p.vx=Math.cos(cur+da)*sp;p.vy=Math.sin(cur+da)*sp;}
      if(!lowfx&&frnd(0,1)<.6)G.fx.push({x:p.x-p.vx*.02,y:p.y-p.vy*.02,smoke:true,col:'#bbb',life:.4,max:.4});}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;curW=p.wid||'etc';
    if(p.blast&&p.life<=0)explode(p);
    for(const e of G.enemies){if(e.dead||p.hit.includes(e.id))continue;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){if(p.blast){explode(p);p.life=0;break;}damage(e,p.dmg,p.col);p.hit.push(e.id);if(p.w==='spear'){const k=p.heavy?.45:.1;e.kx+=p.vx*k;e.ky+=p.vy*k;if(p.heavy){hitstop=Math.max(hitstop,.035);e.sq=.3;}}if(p.pierce--<=0){p.life=0;sparks(p.x,p.y,p.col,5,200);break;}}}}
  G.proj=G.proj.filter(p=>p.life>0);
  for(const p of G.eproj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life>0&&Math.hypot(p.x-G.px,p.y-G.py)<16&&G.hit<=0){p.life=0;if(hurtPlayer(p.dmg))return;}}
  G.eproj=G.eproj.filter(p=>p.life>0);
  // zones
  for(const z of G.zones){z.life-=dt;z.tick-=dt;if(z.warnT>0){z.warnT-=dt;continue;}
    if(z.enemy){if(z.tick<=0){z.tick=.5;if(Math.hypot(G.px-z.x,G.py-z.y)<z.R&&G.hit<=0){if(hurtPlayer(z.dps))return;}}continue;}
    if(z.tick<=0){z.tick=.3;curW=z.wid||'fire';for(const e of G.enemies){if(!e.dead&&Math.hypot(e.x-z.x,e.y-z.y)<z.R+e.r*.5)damage(e,z.dps*.3,z.col);}}}
  G.zones=G.zones.filter(z=>z.life>0);
  // gems & coins
  const mr=70*P.magnet;
  for(const g of G.gems){const dx=G.px-g.x,dy=G.py-g.y,d=Math.hypot(dx,dy);
    if(d<mr||g.pull){g.pull=true;const s=(380+(mr-d)*2)*(1+.25*(G.passives.magnet||0));g.x+=dx/d*s*dt;g.y+=dy/d*s*dt;}
    if(d<16){g.got=true;if(g.heal){sfx('heal');G.hp=Math.min(G.maxhp,G.hp+30);dtext(G.px,G.py-24,'+30','#9ee0c4');glyph(G.px,G.py-40,'饅',"#f3e2b8",40,.5);}
      else if(g.coin){sfx('gem');addGold(g.coin);dtext(G.px,G.py-24,'+'+g.coin+' 金','#ffd080');}
      else{sfx('gem');gainXp(g.v);if(G.tutStep===1)tut(2);}}}
  G.gems=G.gems.filter(g=>!g.got);
  if(G.gems.length>400)G.gems.splice(0,G.gems.length-400);
  // chests
  for(const c of G.chests){if(c.got)continue;c.t+=dt;if(Math.hypot(G.px-c.x,G.py-c.y)<34){c.got=true;G.chests=G.chests.filter(x=>!x.got);openChest(c.big);return;}}
  // cleanup

  for(const p of G.parts){p.life-=dt;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='ember'){p.vx+=frnd(-200,200)*dt;}}G.parts=G.parts.filter(p=>p.life>0);
  for(const c of G.corpses)c.life-=dt;G.corpses=G.corpses.filter(c=>c.life>0);if(G.corpses.length>(lowfx?15:45))G.corpses.splice(0,G.corpses.length-45);
  if(G.moving&&!lowfx){const m=G.passives.horse;if(frnd(0,1)<(m?.9:.35))part(G.px+frnd(-10,10),G.py+10,frnd(-30,30)-G.fxF*40,frnd(-30,-5),'rgba(190,170,130,.5)',frnd(3,7),frnd(.4,.8),-20,'dust');}
  if(G.moving&&G.passives.horse){G.hoof-=dt;if(G.hoof<=0){G.hoof=.22;sfx('hoof');}}
  if(!lowfx)for(const z of G.zones){if(z.warnT>0)continue;for(let i=0;i<1;i++)if(frnd(0,1)<.6)part(z.x+frnd(-z.R*.8,z.R*.8),z.y+frnd(-z.R*.5,z.R*.5),frnd(-25,25),frnd(-160,-60),z.enemy?'#c08aff':i?'#ffd080':'#ff8a3a',frnd(1.5,4),frnd(.5,1.1),-80,'ember');
    if(frnd(0,1)<.25)part(z.x+frnd(-z.R*.6,z.R*.6),z.y-z.R*.4,frnd(-10,10),frnd(-40,-20),'rgba(60,50,45,.5)',frnd(6,12),frnd(.8,1.4),-30,'smokeup');}

  if(shake>0)shake-=dt;
  if(G.gemRain>0){G.gemRain-=dt;for(let i=0;i<3;i++)G.gems.push({x:G.px+rnd(-380,380),y:G.py+rnd(-260,260),v:2});}
  if(G.t>=300&&!META.unl.survive300){META.unl.survive300=true;saveMeta();}

function gainXp(v){G.xp+=v*G.xpmul*(1+.12*(G.passives.book||0));

function tut(step){G.tutStep=step;const el=$('tut');const msgs={0:'방향키 또는 화면 드래그로 움직이세요',1:'적을 쓰러뜨리면 떨어지는 보석을 주우세요',2:'경험치가 차면 카드를 골라 강해집니다',3:''};

function buildOpts(){
  const opts=[];
  for(const w of G.weapons){const D=WEAPONS[w.id];
    if(w.mod&&!w.evo&&G.passives[D.evo.need])opts.push({kind:'evo',w,name:D.evo.name,gl:D.evo.gl,desc:D.evo.desc,tag:'진화'});
    else if(w.lv>=8&&!w.mod&&G.passives[D.modern.need])opts.push({kind:'mod',w,name:D.modern.name,gl:D.modern.gl,desc:D.modern.desc,tag:'현대화',mod:true});
    else if(w.lv<8){const nx=w.lv+1;opts.push({kind:'w',w,id:w.id,name:D.name,gl:D.gl,desc:D.desc,tag:'Lv '+nx});}}
  if(G.weapons.length<5)for(const id in WEAPONS)if(!G.weapons.find(w=>w.id===id)&&!G.banned['w:'+id]&&!(WEAPONS[id].hero&&WEAPONS[id].hero!==G.hero))opts.push({kind:'nw',id,name:WEAPONS[id].name,gl:WEAPONS[id].gl,desc:WEAPONS[id].desc,tag:'신규'});
  const pc=Object.keys(G.passives).length;
  for(const id in PASSIVES){const lv=G.passives[id]||0;if(G.banned['p:'+id])continue;if(lv>=(PASSIVES[id].max||5))continue;if(!lv&&pc>=5)continue;opts.push({kind:'p',id,name:PASSIVES[id].name,gl:PASSIVES[id].gl,desc:PASSIVES[id].desc,tag:lv?'Lv '+(lv+1):'신규'});}
  const evos=opts.filter(o=>o.kind==='evo'||o.kind==='mod'),rest=opts.filter(o=>o.kind!=='evo'&&o.kind!=='mod');
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  const n=G.hero==='zhugeliang'?4:3;const pick=[...evos,...rest].slice(0,n);
  if(!pick.length)pick.push({kind:'heal',name:'만두',gl:'饅',desc:'체력 40 회복',tag:'보급'});
  return pick;
}
function evoLine(id){const D=WEAPONS[id];if(!D.evo)return null;const m=PASSIVES[D.modern.need],e=PASSIVES[D.evo.need];const hm=!!G.passives[D.modern.need],he=!!G.passives[D.evo.need];return {t:'현대화: Lv8 + '+m.name+' '+m.gl+(hm?' ✓':'')+'  →  진화: '+e.name+' '+e.gl+(he?' ✓':''),have:hm};}

    if(o.kind==='p'){const users=Object.keys(WEAPONS).filter(k=>(WEAPONS[k].evo.need===o.id||WEAPONS[k].modern.need===o.id)&&G.weapons.find(w=>w.id===k));if(users.length){const d=document.createElement('div');d.className='ev';d.textContent='재료: '+users.map(k=>WEAPONS[k].name+(WEAPONS[k].modern.need===o.id?' 현대화':' 진화')).join(', ');b.appendChild(d);}}

/* ---------- 픽셀 스프라이트 v2: 음영 램프 + 4프레임 보행 + 기마 ---------- */
// 각 색은 [밝음, 기본, 어둠] 램프. 상자를 칠하면 좌상단은 밝게, 우하단은 어둡게 자동 처리.
const RAMP={
  skin:['#f5d9b8','#e3b88f','#b8865c'],skinR:['#e8926e','#c9684a','#8e4230'],skinD:['#c9a07a','#a57a52','#6e4c30'],
  red:['#ef6a52','#c8402e','#7a1e18'],crim:['#b8402e','#7a1e18','#3f0d0a'],gold:['#f4d88a','#d8a94a','#8c6420'],
  green:['#5fa882','#2f6b4e','#173a2a'],jade:['#8ad4b4','#3f8a62','#1f4d36'],iron:['#c9d2e0','#8f9bb0','#4e5562'],
  steel:['#f0f4f8','#c3cad6','#7a8494'],dark:['#4a3d33','#2b2118','#120d09'],brown:['#a07a52','#7a5a3a','#3a2518'],
  wood:['#8a6a44','#5a4632','#2e2318'],white:['#fffdf7','#efe6d2','#b8ad96'],yellow:['#f7df7a','#e6c23a','#9a7f1c'],
  purple:['#a86bc0','#7b3f8f','#3d1c4a'],blue:['#6f8fd6','#3a5aa0','#1e2f5a'],navy:['#3a4d80','#1e2f5a','#0d1530'],
  moss:['#7fa86b','#4a6b3a','#243a1c'],orange:['#f7c35a','#e8a23a','#9a5f12'],horse:['#a56a3f','#7a4a2e','#3e2314'],
  hare:['#e86a3a','#b8401c','#5c1c0a'],black:['#3a3a3a','#1a1410','#000000'],teal:['#c4f0e0','#9fd6bd','#4f9a7c'],
  silver:['#ffffff','#d9dde4','#8a94a6'],
};
const SPR2={};
function mkGrid(w,h){return {w,h,d:new Array(w*h).fill(null)};}
function gset(g,x,y,c){if(x<0||y<0||x>=g.w||y>=g.h)return;g.d[y*g.w+x]=c;}
function gget(g,x,y){if(x<0||y<0||x>=g.w||y>=g.h)return null;return g.d[y*g.w+x];}
function box(g,x,y,w,h,r,o){o=o||{};const R=RAMP[r]||[r,r,r];
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){let c=R[1];
    if(!o.flat){if((j===0||i===0)&&!o.noHi)c=R[0];if((j===h-1||i===w-1)&&!o.noLo)c=R[2];if(j===h-1&&i===0)c=R[1];if(j===0&&i===w-1)c=R[1];}
    gset(g,x+i,y+j,c);}}
function px(g,x,y,r,t){const R=RAMP[r]||[r,r,r];gset(g,x,y,R[t==null?1:t]);}
function line(g,x0,y0,x1,y1,r,t){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let k=0;k<=n;k++)px(g,Math.round(x0+(x1-x0)*k/n),Math.round(y0+(y1-y0)*k/n),r,t);}
function disc(g,cx,cy,rad,r){const R=RAMP[r]||[r,r,r];for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++){const d=x*x+y*y;if(d<=rad*rad+rad*.5){let c=R[1];if(x+y<-rad*.6)c=R[0];else if(x+y>rad*.7)c=R[2];gset(g,cx+x,cy+y,c);}}}
function outline(g){const o=mkGrid(g.w,g.h);for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=gget(g,x,y);if(c){o.d[y*g.w+x]=c;continue;}
  if([[0,1],[1,0],[0,-1],[-1,0]].some(([dx,dy])=>gget(g,x+dx,y+dy)))o.d[y*g.w+x]='#120d09';}return o;}

function weapon(g,hx,hy,kind,fr){
  const bob=[0,-1,0,1][fr%4];
  if(kind==='club'){line(g,hx,hy+6,hx+1,hy-8,'wood');box(g,hx-1,hy-12,4,5,'wood');px(g,hx,hy-11,'iron',0);px(g,hx+2,hy-9,'iron',0);}
  else if(kind==='spear'){line(g,hx,hy+10,hx+2,hy-22+bob,'wood');box(g,hx+1,hy-30+bob,3,8,'steel');px(g,hx+2,hy-31+bob,'steel',0);box(g,hx+1,hy-23+bob,3,2,'red');line(g,hx+3,hy-21+bob,hx+6,hy-18+bob,'red',0);}
  else if(kind==='guandao'){line(g,hx,hy+12,hx+1,hy-24+bob,'wood');box(g,hx-1,hy-26+bob,4,2,'gold');
    // 청룡 날
    for(let k=0;k<12;k++){const w=Math.round(2+Math.sin(k/11*Math.PI)*4);box(g,hx+1,hy-27-k+bob,w,1,'teal',{flat:k%3!==0});}
    px(g,hx+1,hy-39+bob,'teal',0);box(g,hx+1,hy-22+bob,2,4,'steel');px(g,hx+4,hy-30+bob,'white',0);px(g,hx+5,hy-33+bob,'white',0);}
  else if(kind==='halberd'){line(g,hx,hy+12,hx+1,hy-26+bob,'wood');box(g,hx,hy-36+bob,3,10,'steel');px(g,hx+1,hy-37+bob,'steel',0);
    for(let k=0;k<6;k++)box(g,hx+3,hy-31+k+bob,2+Math.round(Math.sin(k/5*Math.PI)*3),1,'steel',{flat:true});box(g,hx-1,hy-26+bob,5,2,'gold');}
  else if(kind==='bow'){for(let k=-11;k<=11;k++){const x=hx+Math.round(Math.cos(k/11*1.4)*5)-3;px(g,x,hy+k,'brown',Math.abs(k)>8?2:1);}line(g,hx-3,hy-11,hx-3,hy+11,'white',0);
    line(g,hx-6,hy-1,hx+4,hy-1,'wood');px(g,hx+5,hy-1,'steel',0);}
  else if(kind==='sword'){line(g,hx,hy-2,hx,hy-18+bob,'steel',0);line(g,hx+1,hy-2,hx+1,hy-17+bob,'steel',2);box(g,hx-2,hy-2,5,2,'gold');box(g,hx,hy,2,4,'dark');px(g,hx,hy+4,'gold');}
  else if(kind==='fan'){for(let k=0;k<6;k++)box(g,hx-6+k,hy-10-k+bob,8+k,1,'white',{flat:true});for(let k=0;k<4;k++)px(g,hx-2+k*2,hy-13+bob,'white',2);box(g,hx-1,hy-4+bob,3,5,'wood');}
  else if(kind==='bomb'){disc(g,hx+1,hy-4,4,'black');px(g,hx+1,hy-9,'wood');px(g,hx+2,hy-10,'orange',0);px(g,hx+2,hy-11,'yellow',0);}
  else if(kind==='dagger'){line(g,hx,hy-1,hx+1,hy-11+bob,'steel',0);box(g,hx-2,hy-1,5,2,'dark');}
  else if(kind==='shield'){for(let j=-12;j<=12;j++){const w=Math.round(5+Math.cos(j/12*1.5)*4);box(g,hx-14-w,hy+j,w*2,1,'iron',{flat:j%4!==0});}box(g,hx-16,hy-2,4,4,'gold');px(g,hx-15,hy-11,'gold',0);px(g,hx-15,hy+9,'gold',0);}
  else if(kind==='dragon'){line(g,hx,hy+10,hx+2,hy-22+bob,'wood');box(g,hx+1,hy-32+bob,3,10,'silver');px(g,hx+2,hy-33+bob,'white',0);box(g,hx,hy-23+bob,5,2,'blue');px(g,hx-1,hy-24+bob,'blue',0);px(g,hx+5,hy-24+bob,'blue',0);}
}
// ---- 사람 (24x34 격자, 중심 x=12) ----
function human(g,ox,oy,o,fr){
  const walk=o.still?0:fr%4;const legL=[0,2,0,-2][walk],legR=[0,-2,0,2][walk],bob=[0,-1,0,-1][walk];
  const Y=y=>oy+y+bob,X=x=>ox+x;
  // 망토 (뒤)
  if(o.cape){const fl=[0,1,2,1][fr%4];for(let j=0;j<16;j++){const w=10+Math.round(j*.6)+(j>10?fl:0);box(g,X(12-Math.floor(w/2)-1),Y(13+j),w,1,o.cape,{flat:j%4!==0});}}
  // 다리
  box(g,X(7+legL),Y(26),4,6,o.pants||'dark');box(g,X(13+legR),Y(26),4,6,o.pants||'dark');
  box(g,X(7+legL),Y(31),4,2,o.boots||'black');box(g,X(13+legR),Y(31),4,2,o.boots||'black');
  // 하의 치마/로브 자락
  for(let j=0;j<5;j++)box(g,X(6-Math.floor(j/2)),Y(22+j),12+Math.floor(j/2)*2,1,o.robe,{flat:j>0&&j<4});
  // 몸통
  box(g,X(6),Y(12),12,10,o.robe);
  if(o.armor){box(g,X(7),Y(13),10,8,o.armor);for(let j=0;j<3;j++)for(let i=0;i<5;i++)px(g,X(8+i*2),Y(14+j*2+(i%2)),o.armor,0);
    px(g,X(12),Y(13),o.trim||'gold',0);}
  if(o.sash){line(g,X(7),Y(13),X(16),Y(21),o.sash,1);}
  if(o.belt){box(g,X(5),Y(20),14,2,o.belt);px(g,X(12),Y(20),'gold',0);}
  // 어깨
  box(g,X(3),Y(12),4,4,o.pad||o.robe);box(g,X(17),Y(12),4,4,o.pad||o.robe);
  // 팔
  const arm=[0,1,0,-1][walk];box(g,X(3),Y(16),3,6+arm,o.sleeve||o.robe);box(g,X(18),Y(16),3,6-arm,o.sleeve||o.robe);
  box(g,X(3),Y(22+arm),3,2,'skin',{flat:true});box(g,X(18),Y(22-arm),3,2,'skin',{flat:true});
  // 목·머리
  box(g,X(10),Y(10),4,2,o.face||'skin');
  const F=o.face||'skin';disc(g,X(12),Y(6),4,F);box(g,X(9),Y(4),7,6,F,{flat:true});px(g,X(9),Y(4),F,0);px(g,X(10),Y(3),F,0);
  // 눈
  px(g,X(10),Y(6),'black');px(g,X(13),Y(6),'black');px(g,X(10),Y(5),'dark',2);px(g,X(13),Y(5),'dark',2);
  if(o.fierce){px(g,X(9),Y(5),'dark',2);px(g,X(14),Y(5),'dark',2);}
  if(o.patch){box(g,X(9),Y(5),3,2,'black',{flat:true});line(g,X(8),Y(4),X(16),Y(3),'black');}
  if(o.lips){px(g,X(12),Y(8),'red',1);}
  // 수염
  if(o.beard){const b=o.beard;box(g,X(9),Y(8),7,2,'black',{flat:true});for(let j=0;j<b;j++)box(g,X(10+Math.floor(j/3)),Y(10+j),5-Math.floor(j/3)*2,1,'black',{flat:true});}
  if(o.mustache){line(g,X(8),Y(8),X(10),Y(8),'black');line(g,X(14),Y(8),X(16),Y(8),'black');px(g,X(7),Y(9),'black');px(g,X(17),Y(9),'black');}
  // 머리 장식
  const h=o.helm;
  if(h==='band'){box(g,X(8),Y(3),9,2,'yellow');box(g,X(16),Y(2),3,2,'yellow',{flat:true});px(g,X(19),Y(3),'yellow',2);}
  else if(h==='iron'){box(g,X(8),Y(1),9,4,'iron');box(g,X(9),Y(0),7,1,'iron');box(g,X(7),Y(4),11,1,'iron',{flat:true});px(g,X(12),Y(0),'iron',0);}
  else if(h==='hood'){const hc=o.robe==='black'?'black':'moss';box(g,X(8),Y(1),9,4,hc);box(g,X(7),Y(4),2,6,hc,{flat:true});box(g,X(16),Y(4),2,6,hc,{flat:true});box(g,X(9),Y(0),7,1,hc,{flat:true});}
  else if(h==='plume'){box(g,X(8),Y(1),9,4,'crim');box(g,X(7),Y(4),11,1,'gold',{flat:true});box(g,X(9),Y(0),7,1,'crim',{flat:true});line(g,X(12),Y(-1),X(13),Y(-7),'red');px(g,X(14),Y(-8),'red',0);}
  else if(h==='feather'){box(g,X(8),Y(1),9,4,'crim');box(g,X(7),Y(4),11,1,'gold',{flat:true});box(g,X(9),Y(0),7,1,'gold');
    line(g,X(8),Y(1),X(3),Y(-6),'gold',0);line(g,X(16),Y(1),X(21),Y(-6),'gold',0);px(g,X(2),Y(-7),'gold',2);px(g,X(22),Y(-7),'gold',2);}

    const snap=await q.get();tb.innerHTML='';const hd=document.createElement('tr');hd.innerHTML='<th>#</th><th>이름</th><th>무장</th><th class="r">생존</th><th class="r">처치</th><th class="r">점수</th>';tb.appendChild(hd);
    let i=0;for(const d of snap.docs){const v=d.data()||{};i++;const tr=document.createElement('tr');if(d.id===UID)tr.className='me';const t=lbMode==='daily'?v.dtime:v.time,k=lbMode==='daily'?v.dkills:v.kills,sc=lbMode==='daily'?v.dscore:v.score,hr=lbMode==='daily'?v.dhero:v.hero;
      const cells=[i,String(v.name||'무명').slice(0,12),(HEROES.find(h=>h.id===hr)||{}).name||'?',Math.floor((t||0)/60)+':'+String(Math.floor((t||0)%60)).padStart(2,'0'),k||0,(sc||0).toLocaleString()];
      cells.forEach((c,j)=>{const td=document.createElement('td');td.textContent=c;if(j>=3)td.className='r';tr.appendChild(td);});tb.appendChild(tr);}
    st.textContent=i?'상위 '+i+'명':'아직 기록이 없어요. 첫 번째가 되어보세요.';
  }catch(e){st.textContent='순위표를 불러오지 못했어요.';}}
async function submitScore(sc,win){const db=await dbInit();if(!db||!UID)return '';
  try{const ref=db.doc('scores/'+UID);const cur=(await ref.get()).data()||{};const name=META.name||'무명';const now=Date.now();const upd={name};
    if(!cur.score||sc>cur.score)Object.assign(upd,{score:sc,hero:G.hero,time:Math.floor(G.t),kills:G.kills,lvl:G.lvl,win:!!win,at:now});
    if(G.daily){const dk=todayKey();if(cur.ddate!==dk||!cur.dscore||sc>cur.dscore)Object.assign(upd,{ddate:dk,dscore:sc,dhero:G.hero,dtime:Math.floor(G.t),dkills:G.kills});}
    await ref.set(Object.assign({},cur,upd));
    const snap=await db.collection('scores').orderBy('score','desc').limit(100).get();let rank=0,i=0;for(const d of snap.docs){i++;if(d.id===UID){rank=i;break;}}
    return rank?'천하 순위 '+rank+'위'+(upd.score?' (최고 기록 갱신)':''):'순위표에 기록됨';
  }catch(e){return '';}}

/* ---------- 이어하기 ---------- */
function saveRun(){if(!G||!running)return;try{const snap=Object.assign({},G,{fx:[],parts:[],texts:[],corpses:[],proj:[],eproj:[]});localStorage.setItem('sg_save',JSON.stringify({G:snap,obst:OBST,at:Date.now()}));}catch(e){}}
function checkResume(){try{const r=localStorage.getItem('sg_save');if(!r){$('resumerow').hidden=true;return;}const d=JSON.parse(r);const h=HEROES.find(x=>x.id===d.G.hero);$('resumeinfo').textContent=h.name+' · '+Math.floor(d.G.t/60)+'분 '+Math.floor(d.G.t%60)+'초 · Lv '+d.G.lvl;$('resumerow').hidden=false;
  $('resumerun').onclick=()=>{audioInit();bgmStart();G=d.G;OBST=d.obst||[];for(const k of ['parts','corpses','chests','fx','texts','gems','proj','eproj','zones','enemies'])G[k]=G[k]||[];G.lm=G.lm||{};G.banned=G.banned||{};G.dmgBy=G.dmgBy||{};rng=mulberry((Math.random()*1e9)|0);G.autoPick=autoPick;recalc();slots();hud();
    for(const el of ['start','end','chest','levelup','pause'])$(el).hidden=true;$('hud').hidden=false;$('tut').style.display='none';running=true;paused=false;last=performance.now();requestAnimationFrame(loop);};}catch(e){$('resumerow').hidden=true;}}
checkResume();
addEventListener('beforeunload',()=>{if(running&&G&&G.t>20)saveRun();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&G&&G.t>20)saveRun();});
/* ---------- 모바일 ---------- */
function checkRotate(){const touch=matchMedia('(pointer:coarse)').matches;const portrait=innerHeight>innerWidth*1.2;const dismissed=sessionStorage.getItem('sg_rot')==='1';$('rotate').style.display=(touch&&portrait&&!dismissed)?'flex':'none';}
$('rotateok').onclick=()=>{try{sessionStorage.setItem('sg_rot','1');}catch(e){}$('rotate').style.display='none';};
addEventListener('resize',checkRotate);try{checkRotate();}catch(e){}

/* ---------- 핫 업데이트 ---------- */
try{window.claude?.hot?.snapshot?.(()=>running?{G,paused}:null);}catch(e){}
function boot(d){if(d&&d.G){G=d.G;for(const k of ['parts','corpses','chests','fx','texts','gems','proj','eproj','zones','enemies'])G[k]=G[k]||[];G.lm=G.lm||{};rng=mulberry((Math.random()*1e9)|0);recalc();slots();$('start').hidden=true;$('hud').hidden=false;running=true;paused=true;$('pause').hidden=false;renderCombo();last=performance.now();requestAnimationFrame(loop);}}
try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data);}catch(e){}
})();
</script>
